name: Release

on:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source and release version
        run: |
          node --check main.js
          node <<'NODE'
          const assert = require("node:assert/strict");
          const manifest = require("./manifest.json");
          const versions = require("./versions.json");
          assert.equal(versions[manifest.version], manifest.minAppVersion);
          if (process.env.GITHUB_REF_TYPE === "tag") {
            assert.equal(process.env.GITHUB_REF_NAME, manifest.version);
          }
          NODE
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" main.js manifest.json styles.css --verify-tag --title "$RELEASE_TAG" --generate-notes
